name: test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 画面のテスト（tests/browser.test.mjs）が skip にならないように、CI でだけ Playwright と Chromium を入れる
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm test
