<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>漢字版（仮）モック</title>
<link rel="stylesheet" href="fonts/kj-glyphs.css">
<style>
:root{
  --bg:#f6f4ef; --ink:#1d1b18; --sub:#6b665d; --line:#d9d4c9; --tile:#fffdf8; --cut:#aaa59a;
  --slot:#ebe7de; --accent:#c8402a; --ok:#2f6b4f; --dim:#a9a397; --join:#2f6fd6;
  --gauge:#cfe3d6; /* 待ち時間のゲージ（KJ-034。仮決め） */
  --kanji:"KJ Glyphs","Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Noto Serif JP","Source Han Serif JP",serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "KJ Glyphs",system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px 14px 48px}
h1{font-size:17px;margin:0 0 2px;font-weight:700}
.lead{color:var(--sub);font-size:13px;margin:0 0 14px}
.side{margin:14px 0}
.side-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;height:24px;white-space:nowrap;overflow:hidden}
.side-head b{font-size:15px}
.count{font-variant-numeric:tabular-nums;color:var(--sub);font-size:13px}
.score{font-variant-numeric:tabular-nums;font-size:15px;font-weight:700}
.takes{font-size:13px;color:var(--accent);font-weight:700}
.cds{margin-left:auto;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.hand{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.trayhead{font-size:12px;color:var(--sub);margin:8px 0 3px}
.tray .slot{background:transparent;outline:1px dashed var(--line);outline-offset:-1px}
.tray .tile{border-style:dashed}
.opp{display:inline-flex;gap:10px;align-items:center;font-size:14px;flex-wrap:wrap}
.opp label{cursor:pointer;white-space:nowrap}
.slot{aspect-ratio:1;background:var(--slot);border-radius:4px}
.tile{aspect-ratio:1;position:relative;background:var(--tile);border:1px solid var(--line);border-radius:4px;
  display:flex;align-items:center;justify-content:center;font-family:var(--kanji);font-size:clamp(20px,4.6vw,30px);
  cursor:pointer;user-select:none;padding:0;color:var(--ink);width:100%}
.tile:hover{border-color:var(--ink)}
/* 選んだ札は手札・ストックのマスに残り、色が変わって角に選んだ順の数字が付く（KJ-030）。指一本で札を引きずって入れ替える */
.me .tile{touch-action:none}
.tile.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.tile .ord{position:absolute;top:1px;left:3px;font:bold 12px/1.2 system-ui,sans-serif;color:#fff}
.tile.drag{opacity:.55;border-style:dashed}
.tile.over{border-color:var(--accent);border-width:2px}
/* 引きずってくっつける（KJ-017）：くっつけられる相手の札の枠は青。上に来た札は大きく見せ、落とすと字になる面だけ青く光る（指している面は濃く） */
.tile.joinable{border-color:var(--join);box-shadow:0 0 0 1px var(--join)}
.tile.jt{transform:scale(1.5);z-index:4;box-shadow:0 0 0 2px var(--join),0 4px 10px rgba(0,0,0,.18)}
.tile .fz{position:absolute;inset:0;background:var(--join);opacity:.25;pointer-events:none;z-index:2}
.tile .fz.on{opacity:.7}
.tile .fz.top{clip-path:polygon(0 0,100% 0,70% 30%,30% 30%)}
.tile .fz.bottom{clip-path:polygon(30% 70%,70% 70%,100% 100%,0 100%)}
.tile .fz.left{clip-path:polygon(0 0,30% 30%,30% 70%,0 100%)}
.tile .fz.right{clip-path:polygon(100% 0,100% 100%,70% 70%,70% 30%)}
.tile .fz.center{inset:30%;border-radius:2px}
.tile.part{background:#f1ede4;color:#4a463f}
.tile.part.sel{background:var(--accent);border-color:var(--accent);color:#fff} /* 部品の札も選ぶと赤地に白（部品の色に負けない） */
.tile.new{border-color:var(--accent);border-width:2px}
.tile .mk{position:absolute;top:1px;right:3px;font:10px/1.2 system-ui,sans-serif;color:var(--accent);letter-spacing:-1px}
.tile.sel .mk{color:#fff} /* 選んだ札（赤地）の上でも角の印（⇄↻♪）が見える（KJ-024。PR #22 のレビューの気づき） */
.tile .orig{position:absolute;bottom:1px;left:3px;font:10px/1 system-ui,sans-serif;color:var(--sub)}
/* 割れる札の点線（KJ-014）：字に重ねる。角の印（反・巡・音＝右上、選んだ順＝左上、元の字＝左下）とぶつからないよう、その分だけ線を短くする */
.tile .cut{position:absolute;pointer-events:none;z-index:1}
.tile .cutv{left:calc(var(--at)*100%);top:7%;bottom:7%;border-left:1.5px dashed var(--cut)}
.tile .cuth{top:calc(var(--at)*100%);left:7%;right:7%;border-top:1.5px dashed var(--cut)}
.tile .cutx{right:2px;bottom:1px;font:bold 9px/1 system-ui,sans-serif;color:var(--cut);border:1px solid var(--cut);border-radius:2px;padding:0 1px}
.tile.hasmk .cutv.r{top:36%}
.tile.sel .cutv.l{top:36%}
.tile.hasmk .cuth.t{right:56%}
.tile.sel .cuth.t{left:34%}
.tile.sel .cut{--cut:#fff}
.cpu .hand{gap:3px}
.cpu .tile{font-size:clamp(14px,3.4vw,22px);cursor:default}
.cpu .tile:hover{border-color:var(--line)}
.cpu .tile .mk{display:none}
/* 場（3枚。取ったところは同じ位置に山から出る） */
.field{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:240px}
.field .tile{cursor:default}
.field.can .tile{cursor:pointer;border-color:var(--accent)}
.field:not(.can) .tile:hover{border-color:var(--line)}
@media (max-width:540px){
  .me .tile{font-size:26px}
  .cpu .hand{grid-template-columns:repeat(8,1fr)}
  .tile .mk{font-size:10px}
}
/* 台（高さを固定する） */
.stage{position:relative;background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px;margin:14px 0}
.row{display:flex;gap:6px;height:72px;align-items:center;overflow-x:auto;overflow-y:hidden}
.row .tile{width:64px;height:64px;font-size:40px;flex:none}
.row .empty{color:var(--dim);font-size:13px}
.info{height:46px;margin:6px 0 8px;font-size:14px;line-height:23px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.info .w{font-family:var(--kanji);font-size:18px}
.info .no{color:var(--sub)}
.info .rev{color:var(--accent);font-weight:700}
.info .pts{color:var(--accent);font-weight:700}
.ops{display:flex;flex-wrap:wrap;gap:6px}
button.op{font:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:4px;cursor:pointer;min-width:64px}
button.op:disabled{border-color:var(--line);color:var(--dim);cursor:default}
button.op.main{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button.op.main:disabled{background:#fff;border-color:var(--line);color:var(--dim);font-weight:400}
.cdv{display:inline-block;width:2.2em;text-align:left;font-variant-numeric:tabular-nums;font-size:12px}
#bRedraw .cdv{width:5.4em}
/* 待ち時間のゲージ（KJ-034）：使ったあと、ボタンの地が左から右へ満ちていく。満ちたら押せる。満ちた瞬間に小さく光る（色は仮決め） */
button.op.cd{position:relative;isolation:isolate}
button.op.cd::before{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(var(--g,0) * 100%);background:var(--gauge);z-index:-1;transition:width .25s linear;pointer-events:none}
button.op.full{animation:kjGaugeFull .6s ease-out}
@keyframes kjGaugeFull{0%{box-shadow:0 0 0 0 rgba(47,107,79,.55)}100%{box-shadow:0 0 0 6px rgba(47,107,79,0)}}
@media (prefers-reduced-motion:reduce){button.op.full{animation:none}} /* 動きを減らす設定：光るのだけやめる（ゲージの満ち方は出す） */
/* 選ぶ札（同音・くっつけて2通り）は台の下に重ねて出す。手札を押し下げない */
.choices{display:none;position:absolute;left:-1px;right:-1px;top:calc(100% - 4px);z-index:5;background:#fff;border:1px solid var(--line);border-radius:0 0 6px 6px;padding:8px 12px;box-shadow:0 6px 14px rgba(0,0,0,.12)}
.choices.on{display:block}
.choices .g{margin:4px 0;display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.choices .g span{font-size:12px;color:var(--sub);min-width:64px}
.choices button{font-family:var(--kanji);font-size:22px;width:44px;height:44px;border:1px solid var(--line);background:var(--tile);border-radius:4px;cursor:pointer}
/* はじめる前の画面（KJ-007） */
.setup{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px 14px 16px;margin:8px 0}
.setup h2{font-size:15px;margin:0 0 10px}
.setup .grp{margin:0 0 12px}
.setup .gt{font-size:12px;color:var(--sub);margin:0 0 4px}
.setup .opp{gap:14px}
.setup .opp label{padding:4px 0}
.setup button.op.main{width:100%;margin-top:6px;padding:12px}
/* 合言葉の部屋（KJ-033 後半）：部屋を作る・合言葉で入る・待つ */
.roomrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.roomrow input{font:inherit;font-size:18px;width:7.5em;padding:6px 8px;border:1px solid var(--ink);border-radius:4px;letter-spacing:.15em;font-variant-numeric:tabular-nums}
.roomcode{font-size:32px;font-weight:700;letter-spacing:.2em;font-variant-numeric:tabular-nums;margin:4px 0}
.cds.gone{color:var(--accent);font-weight:700}
[hidden]{display:none!important}
/* 上の帯・ログ */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.clock{margin-left:auto;font-variant-numeric:tabular-nums;font-size:14px;color:var(--sub)}
.msgline{height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.msg{font-weight:700}
.msg.win{color:var(--ok)} .msg.lose{color:var(--accent)}
.note{color:var(--sub);font-size:12px}
.panel{display:none;background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:8px 0}
.panel.on{display:block}
.panel textarea{width:100%;height:220px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:4px;padding:6px;white-space:pre;resize:vertical}
/* 放った言葉 */
.log{font-size:13px;margin:0;padding:0;list-style:none;max-height:180px;overflow:auto}
.log li{padding:3px 0;color:var(--sub)}
.log li .w{font-family:var(--kanji);font-size:16px;color:var(--ink)}
.log li.me .who{color:var(--ink)}
details{margin-top:22px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:700}
details p,details li{font-size:13px;color:#3d3a34}
details ul{padding-left:18px}
.credit{color:var(--sub);font-size:12px}
/* 特別な語の演出 */
#fx{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(246,244,239,.92);z-index:10;pointer-events:none}
#fx.on{display:flex}
#fx .c{font-family:var(--kanji);font-size:min(22vw,150px);line-height:1;opacity:0;transform:scale(1.6);transition:opacity .12s,transform .18s}
#fx .c.in{opacity:1;transform:scale(1)}
#fx .who{position:absolute;top:18%;font-size:14px;color:var(--sub)}
/* ストックが空のときは低く薄く（札が入ったら手札と同じ形）。引きずっている間は、落とせるよう元の大きさにする（KJ-010） */
.tray.empty .slot{aspect-ratio:auto;height:18px}
body.dragging .tray.empty .slot{aspect-ratio:1;height:auto}
/* 遊ぶ画面を375×700に収める（KJ-010）：札は小さく（40px以上）、場は1行、CPU の手札は伏せて枚数だけ、ボタンは2段 */
@media (max-width:540px){
  main{padding:8px 10px 32px}
  body.playing h1,body.playing .lead{display:none}
  .hand{gap:3px}
  .side{margin:6px 0}
  .side-head{height:20px;margin-bottom:3px}
  .cpu #cpuHand{display:none}
  .cds{font-size:11px;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .fieldside{display:flex;align-items:center;gap:8px;margin:6px 0}
  .fieldside .side-head{margin:0;height:auto}
  .field{max-width:144px;width:144px;flex:none;gap:4px}
  .field .tile{font-size:24px}
  .fieldside .takes{flex:1;font-size:12px;line-height:1.35;min-width:0}
  .bar{gap:5px 6px;margin:4px 0}
  .bar button.op{font-size:13px;padding:4px 9px;min-width:0}
  .clock{font-size:13px;margin-left:auto}
  .msgline{height:20px;font-size:13px}
  .stage{padding:8px;margin:6px 0}
  .row{height:52px;gap:4px}
  .row .tile{width:46px;height:46px;font-size:30px}
  .info{height:38px;margin:4px 0 6px;font-size:13px;line-height:19px}
  .info .w{font-size:16px}
  /* ボタンは12列の2段に固定する（字の幅が環境でちがっても折り返さない） */
  .ops{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
  .ops button.op{font-size:13px;padding:6px 1px;min-width:0;white-space:nowrap;overflow:hidden;text-align:center}
  /* 英語の文字（KJ-024）に合わせた幅：上の段 Play・Split・Join・⇄ Flip・↻ Cycle、下の段 ♪ Sound conversion・Back・Redraw */
  #bRelease,#bSplit,#bJoin,#bBack{grid-column:span 2}
  #bInvert,#bCycle{grid-column:span 3}
  #bHomo,#bRedraw{grid-column:span 5}
  #bInvert,#bCycle,#bHomo{white-space:normal;line-height:1.25} /* Sound conversion（と、字体で幅が広いときの Flip・Cycle）は収まらなければ2行に折り返す（字は小さくしない） */
  .ops .cdv{width:2em;font-size:11px}
  #bRedraw .cdv{width:3.8em}
  .trayhead{margin:4px 0 2px;line-height:1.3}
</style>
</head>
<body>
<main>
  <h1>漢字版（仮）モック</h1>
  <p class="lead" id="lead"></p>

  <section class="setup" id="setup">
    <h2>はじめる前に選ぶ</h2>
    <div class="grp"><p class="gt">相手</p><span class="opp" id="opp" role="radiogroup" aria-label="相手"></span></div>
    <div class="grp"><p class="gt">レベル</p><span class="opp" id="lvl" role="radiogroup" aria-label="レベル"></span></div>
    <div class="grp"><p class="gt">時間</p><span class="opp" id="tim" role="radiogroup" aria-label="時間"></span></div>
    <div class="grp" id="roomBox" hidden>
      <p class="gt">合言葉の部屋（人と対戦。部屋を作った人のレベル・時間で遊ぶ）</p>
      <div class="roomrow"><button class="op" id="bHost">部屋を作る</button></div>
      <div class="roomrow"><input id="roomCode" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="数字4けた" aria-label="合言葉"><button class="op" id="bEnter">合言葉で入る</button></div>
      <p class="roomcode" id="roomShow" hidden></p>
      <p class="note" id="roomMsg"></p>
      <button class="op" id="bRoomCancel" hidden>やめる</button>
    </div>
    <p class="note" id="setupInfo"></p>
    <button class="op main" id="start">はじめる</button>
  </section>

  <div id="game" hidden>
  <div class="bar">
    <button class="op" id="again">もう一度</button>
    <button class="op" id="bSetup">設定を変える</button>
    <button class="op" id="bLog">ログ</button>
    <button class="op" id="bCopyEnd" hidden>ログをコピー</button>
    <span class="clock" id="clock"></span>
  </div>
  <div class="msgline"><span class="msg" id="msg"></span></div>

  <section class="panel" id="logPanel">
    <textarea id="logText" readonly></textarea>
    <div class="bar"><button class="op" id="bCopy">コピー</button><span class="note" id="copyMsg"></span></div>
  </section>

  <section class="side cpu" id="cpuSide">
    <div class="side-head"><b id="cpuName">CPU</b><span class="score" id="cpuScore"></span><span class="count" id="cpuCount"></span><span class="cds" id="cpuCds"></span></div>
    <div class="hand" id="cpuHand"></div>
  </section>

  <section class="side fieldside">
    <div class="side-head"><b>場</b></div>
    <div class="field" id="field"></div>
    <span class="takes" id="takes"></span>
  </section>

  <section class="stage">
    <div class="row" id="row"></div>
    <div class="info" id="info"></div>
    <div class="ops">
      <!-- ボタンの文字は js/strings.js から入れる（英語。KJ-024） -->
      <button class="op main" id="bRelease"><span class="lb"></span></button>
      <button class="op" id="bSplit"><span class="lb"></span></button>
      <button class="op" id="bJoin"><span class="lb"></span></button>
      <button class="op" id="bInvert"><span class="lb"></span></button>
      <button class="op" id="bCycle"><span class="lb"></span></button>
      <button class="op" id="bHomo"><span class="lb"></span></button>
      <button class="op" id="bBack"><span class="lb"></span></button>
      <button class="op" id="bRedraw"><span class="lb"></span> <span class="cdv" id="cdRedraw"></span></button>
    </div>
    <div class="choices" id="choices"></div>
  </section>

  <section class="side me" id="meSide">
    <div class="side-head"><b>あなた</b><span class="score" id="meScore"></span><span class="count" id="meCount"></span></div>
    <div class="hand" id="meHand"></div>
    <div class="trayhead" id="trayHead"></div>
    <div class="hand tray" id="meTray"></div>
  </section>

  <section class="side">
    <div class="side-head"><b>放った言葉</b><span class="count">（二人とも二度と使えない）</span></div>
    <ul class="log" id="released"></ul>
  </section>

  </div>

  <details>
    <summary>しくみ</summary>
    <ul id="howto"></ul>
    <p class="credit">データ：JMdict・KANJIDIC2（© Electronic Dictionary Research and Development Group, EDRDG。CC BY-SA 3.0。<a href="https://www.edrdg.org/edrdg/licence.html">ライセンス</a>）。jamdict-data 経由で取り込み、語・字・読みを抜き出して加工しています。N5 の字は KANJIDIC2 の旧4級（103字）で代用。</p>
  </details>
</main>
<div id="fx"><div class="who" id="fxWho"></div><div id="fxChars" style="display:flex;gap:2vw"></div></div>

<script src="js/core.js"></script>
<script src="js/strings.js"></script>
<script>
"use strict";
const K=window.KJ;
const STR=window.KJ_STR; // 画面の文言（ボタンの文字・角の印。KJ-024）
for(const [id,text] of Object.entries(STR.BUTTONS))document.querySelector(`#${id} .lb`).textContent=text;
const D={};
let T=null, G=null; // 表・ゲームの状態
const TABLES={};    // レベルごとの表（KJ-006）
const LVL_KEY="kj-level";
let level=null;     // レベル（"N5"／"N4"）。はじめるときに効く。端末に覚える
let row=[];         // 選んだ札の id（選んだ順。台にはその写しを左から並べる）
let lastTried="";
const OPP_KEY="kj-opponent",TIME_KEY="kj-time";
let opponent=null;  // 相手。端末に覚える（KJ-007）
let timeLimit=null; // 制限時間（秒）。端末に覚える（KJ-007）
const $=id=>document.getElementById(id);
const clock=()=>performance.now()/1000;

// ---------- ログ ----------
function refreshLogPanel(){if($("logPanel").classList.contains("on"))$("logText").value=G?G.logText():"（まだはじめていない）"}
$("bLog").onclick=()=>{$("logPanel").classList.toggle("on");refreshLogPanel()};
function copyLog(){
  if(!G)return;
  const text=G.logText(),m=$("copyMsg");
  const fallback=()=>{$("logPanel").classList.add("on");const ta=$("logText");ta.value=text;ta.focus();ta.select();
    let ok=false;try{ok=document.execCommand("copy")}catch(e){}
    m.textContent=ok?"コピーした":"選んである文字を手でコピーしてください"};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>{m.textContent="コピーした";flashCopied()},fallback);
  else fallback();
}
function flashCopied(){const b=$("bCopyEnd");if(!b.hidden){b.textContent="コピーした";setTimeout(()=>b.textContent="ログをコピー",1500)}}
$("bCopy").onclick=copyLog;$("bCopyEnd").onclick=copyLog;

// ---------- はじめる ----------
let cpuTimer=null;
// 端末に覚える3つ（KJ-007。並べ方は KJ-030 でなくした）。読めない・書けないときは初期値で動く
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}
function loadSettings(){
  const o=lsGet(OPP_KEY);opponent=OPP_CHOICES().some(x=>x.key===o)?o:D.rules.opponent_default;

// 選ぶものを並べる：name のラジオ。onPick は選んだ値を受け取る
function radios(box,name,items,cur,onPick){
  for(const o of items){
    const l=document.createElement("label");
    l.innerHTML=`<input type="radio" name="${name}" value="${o.value}"${String(o.value)===String(cur)?" checked":""}> ${o.label}`;
    if(o.title)l.title=o.title;
    l.querySelector("input").onchange=()=>onPick(o.value);
    box.appendChild(l);
  }
}

  radios($("opp"),"opp",OPP_CHOICES().map(o=>({value:o.key,label:o.label})),opponent,v=>{cancelRoom();opponent=v;lsSet(OPP_KEY,v);roomUi()});

function scheduleCpu(){cpuTimer=setTimeout(()=>{if(!G||G.over)return;G.cpuTurn();afterChange();if(!G.over)scheduleCpu()},G.cpuDelay()*1000)}
function drain(){
  if(!G)return;
  while(G.events.length){
    const e=G.events.shift();
    if(e.type==="fx")showFx(e.who,e.text);
    if(e.type==="over")end(e.winner,e.solo);
  }
}
// ひとりでの自己ベスト（その端末だけ。読めない・書けないときは出さない）
const BEST_KEY="kj-solo-best";
function soloBest(score){
  let prev=null;
  try{const v=localStorage.getItem(BEST_KEY);if(v!==null&&v!==""&&!isNaN(+v))prev=+v}catch(e){return null}
  const best=prev===null||score>prev?score:prev;
  try{localStorage.setItem(BEST_KEY,String(best))}catch(e){return null}
  return {best,isNew:prev===null||score>prev};
}
// ---------- ログの自動送信（KJ-020）----------
// 試合が終わったとき（途中で捨てたときも、1手以上動いていれば）、ログ全文を作者の表（play_logs）に1行送る。画面には何も出さない。
// 送る先は書き込みだけの公開鍵（publishable）。手元（localhost）とテスト（webdriver）では送らない
const LOG_URL="https://ysxrdhzybzvucxwdqchw.supabase.co/rest/v1/play_logs";
const LOG_KEY="sb_publishable_YSX3OMEXFAdtx8xTwvtcDw_ErF7tfQ7";
const DEVICE_KEY="kj-device",UNSENT_KEY="kj-unsent-log";
const randId=()=>{try{const a=new Uint8Array(12);crypto.getRandomValues(a);return Array.from(a,x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return String(Date.now())+Math.random().toString(16).slice(2)}};
let gameDevice=null; // localStorage が読めないときは、試合ごとの無作為
function deviceId(){
  const v=lsGet(DEVICE_KEY);if(v&&v.length>=8)return v;
  const id=randId();lsSet(DEVICE_KEY,id);
  return lsGet(DEVICE_KEY)===id?id:(gameDevice||(gameDevice=randId()));
}
async function postLog(row){
  try{
    const r=await fetch(LOG_URL,{method:"POST",headers:{"content-type":"application/json",apikey:LOG_KEY,Prefer:"return=minimal"},body:JSON.stringify(row)});
    return r.ok;
  }catch(e){return false}
}
async function sendLog(g){
  try{
    if(!K.logSendAllowed({hostname:location.hostname,webdriver:navigator.webdriver,force:window.__KJ_LOG_FORCE}))return;
    const row=K.playLogRow(g,deviceId());if(!row)return;
    const list=[];
    const old=lsGet(UNSENT_KEY);
    if(old){try{list.push(JSON.parse(old))}catch(e){}}
    list.push(row);
    try{localStorage.removeItem(UNSENT_KEY)}catch(e){}
    let failed=null;
    for(const x of list){if(!(await postLog(x)))failed=x}
    if(failed)lsSet(UNSENT_KEY,JSON.stringify(failed)); // 失敗は1件だけ残し、次の試合の終わりにもう一度送る
  }catch(e){}
}
// 終わらないまま捨てる（もう一度・設定を変える）ときも送る
function sendAbandoned(){if(G&&!G.over)sendLog(G)}
function end(winner,solo){
  clearTimeout(cpuTimer);
  sendLog(G);
  if(MC){MC.stop();MC=null;LINK.closeAll();ROOM=null}
  const m=$("msg"),sc=`${G.me.score} 対 ${G.cpu.score}`;
  if(solo){
    const b=soloBest(G.me.score);
    m.textContent=`ひとりで ${G.me.score} 点`+(b?(b.isNew?`（自己ベスト更新）`:`（自己ベスト ${b.best} 点）`):"");
    m.className="msg";
    $("bCopyEnd").hidden=false;
    return;
  }
  if(winner===G.me){m.textContent=`勝ち（${sc}）`;m.className="msg win"}
  else if(winner===G.cpu){m.textContent=`負け（${sc}）`;m.className="msg lose"}
  else{m.textContent=`引き分け（${sc}）`;m.className="msg"}
  $("bCopyEnd").hidden=false;
}

// ---------- 合言葉の部屋（KJ-033 後半・D-049）：つなぎと、部屋を作る／入る ----------
// 表 kj_claims（Supabase kanji-barabara）。入れる（REST の POST）・読む（REST の GET）だけ。鍵は play_logs と同じ publishable。
// 相手の行は Realtime（supabase-js。版を固定して CDN から、必要になったときだけ読む）で受け取り、REST でも数秒ごとに取りこぼしを拾う。
// Realtime が読めない・つながらないときは REST の読み直しだけで動く（少し遅れる）
const SB_URL="https://ysxrdhzybzvucxwdqchw.supabase.co";
const CLAIMS_URL=SB_URL+"/rest/v1/kj_claims";
const SB_JS="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js";
const SB_SRI="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o";
const POLL_MS=()=>window.__KJ_POLL_MS||1500, POLL_RT_MS=()=>window.__KJ_POLL_MS||4000;
const cryptoRand=()=>{try{return crypto.getRandomValues(new Uint32Array(1))[0]/4294967296}catch(e){return Math.random()}};
const fetchTimeout=()=>{try{return AbortSignal.timeout(K.MATCH_INSERT_TIMEOUT_SEC*1000)}catch(e){return undefined}}; // 部屋の前の insert・読み直しも固まらないように
const normRow=r=>r&&typeof r==="object"?{...r,created_at:typeof r.created_at==="string"?Date.parse(r.created_at)/1000:r.created_at}:null;
async function claimsGet(mid,kind,key,sinceSec){
  const q=new URLSearchParams({select:"match_id,kind,key,player,payload,created_at",match_id:"eq."+mid,order:"created_at.asc",limit:"1000"});
  if(kind)q.set("kind","eq."+kind);
  if(key!==undefined)q.set("key","eq."+key);
  if(sinceSec)q.set("created_at","gte."+new Date((sinceSec-5)*1000).toISOString()); // 5秒前から読み直す（同じ行は捨てる）
  try{const r=await fetch(CLAIMS_URL+"?"+q,{headers:{apikey:LOG_KEY},signal:fetchTimeout()});if(!r.ok)return null;const j=await r.json();return Array.isArray(j)?j.map(normRow).filter(Boolean):null}catch(e){return null}
}
async function claimsInsert(row){
  try{
    const r=await fetch(CLAIMS_URL,{method:"POST",headers:{apikey:LOG_KEY,"content-type":"application/json",Prefer:"return=representation"},body:JSON.stringify(row),signal:fetchTimeout()});
    if(r.ok){let x=null;try{const j=await r.json();x=normRow(Array.isArray(j)?j[0]:j)}catch(e){}if(x)LINK.deliver(x);return {ok:true,row:x||row}}
    if(r.status===409){const q=await claimsGet(row.match_id,row.kind,row.key);return {ok:false,conflict:true,player:q&&q[0]?q[0].player:undefined}} // ぶつかった行の player を返す（約束）
    return {ok:false,error:"HTTP "+r.status};
  }catch(e){return {ok:false,error:String(e)}}
}
let sbLib=null;
function loadSb(){
  if(!sbLib)sbLib=new Promise((res,rej)=>{
    if(window.supabase&&window.supabase.createClient){res(window.supabase);return}
    const s=document.createElement("script");s.src=SB_JS;s.integrity=SB_SRI;s.crossOrigin="anonymous";
    s.onload=()=>window.supabase&&window.supabase.createClient?res(window.supabase):rej(new Error("supabase-js"));s.onerror=()=>rej(new Error("supabase-js"));
    document.head.appendChild(s);
  }).then(lib=>lib.createClient(SB_URL,LOG_KEY,{auth:{persistSession:false,autoRefreshToken:false}}));
  return sbLib;
}
// match_id ごとに、届いた行を1回ずつ配る（Realtime と REST の読み直しで同じ行が二度来ても1回）
const LINK=(()=>{
  const subs=new Map();
  function deliver(row){
    const s=row&&subs.get(row.match_id);if(!s)return;
    const k=row.kind+"\u0000"+row.key;if(s.seen.has(k))return;
    s.seen.add(k);s.rows.push(row);
    if(typeof row.created_at==="number"&&row.created_at>(s.since||0))s.since=row.created_at;
    for(const fn of [...s.fns]){try{fn(row)}catch(e){console.error(e)}}
    if(G)afterChange();
  }
  async function poll(mid){
    const s=subs.get(mid);if(!s||s.busy)return;s.busy=true;
    const rows=await claimsGet(mid,undefined,undefined,s.since);
    s.busy=false;if(rows&&subs.get(mid)===s)rows.forEach(deliver);
  }
  function open(mid){
    const s={fns:new Set(),seen:new Set(),rows:[],since:0,rt:false,ch:null,busy:false,timer:null};
    subs.set(mid,s);
    const loop=()=>{if(subs.get(mid)!==s)return;poll(mid);s.timer=setTimeout(loop,s.rt?POLL_RT_MS():POLL_MS())};
    loop();
    loadSb().then(sb=>{
      if(subs.get(mid)!==s)return;
      s.ch=sb.channel("kj-"+mid).on("postgres_changes",{event:"INSERT",schema:"public",table:"kj_claims",filter:"match_id=eq."+mid},p=>deliver(normRow(p.new)))
        .subscribe(st=>{s.rt=st==="SUBSCRIBED";if(s.rt)poll(mid)});
    }).catch(()=>{}); // 読めなければ REST の読み直しだけ
    return s;
  }
  function close(mid){const s=subs.get(mid);if(!s)return;subs.delete(mid);clearTimeout(s.timer);if(s.ch)try{s.ch.unsubscribe()}catch(e){}}
  return {
    deliver,
    subscribe(mid,fn){const s=subs.get(mid)||open(mid);s.fns.add(fn);for(const r of s.rows.slice())try{fn(r)}catch(e){}return()=>s.fns.delete(fn)},
    closeAll(){for(const mid of [...subs.keys()])close(mid)},
    pollNow(){for(const mid of subs.keys())poll(mid)},
  };
})();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)LINK.pollNow()});
const CLAIMS={insert:claimsInsert,subscribe:(mid,fn)=>LINK.subscribe(mid,fn),
  select:async(mid,kind)=>{const rows=await claimsGet(mid,kind);return rows?{ok:true,rows}:{ok:false,error:"つながらない"}}};

// 二人とも 'start' 行が届いたときに始める。始まりの時刻はその行の created_at から
function beginRoom(startRow){

// ---------- 人の操作 ----------
const rowCards=()=>row.map(id=>G.byId(G.me,id)).filter(Boolean);
const rowText=()=>rowCards().map(x=>x.c).join("");
function rowState(){
  const rc=rowCards(),text=rowText(),rl=K.releasable(T,G.used,text);
  const pair=rc.length===2?[rc[0].c,rc[1].c]:null;
  const joins=pair?K.joinResults(T,...pair):[];
  const reversed=pair?K.joinReversed(T,...pair):false;
  return {rc,text,rl,joins,reversed};
}
// 並べたのに、放つも・くっつけるもできないままやめた並びを「ためした」に残す（R-018）
function noteTried(){
  const s=rowState();
  if(s.rc.length<2||s.rl.ok||s.joins.length)return;
  const why=s.reversed?"並べる順が逆":s.rl.why;
  const key=s.text+"|"+why;if(key===lastTried)return;lastTried=key;
  G.tried(G.me,s.rc.map(x=>x.c),why);
}
let dragEnded=false; // 引きずって離したあとに出るタップを無視する
function tapHand(id){
  if(G.over||dragEnded)return;
  if(row.includes(id)){tapRow(id);return} // もう一度タップで選びが外れる
  row.push(id);lastTried="";hideChoices();render();
}
// 面でくっつける（KJ-017・D-035）：札の上のどこを指しているか。真ん中の四角（幅・高さの30%〜70%）が中央、まわりは対角線で上・下・左・右に分ける
function faceAt(el,ev){
  const r=el.getBoundingClientRect(),u=(ev.clientX-r.left)/r.width-.5,v=(ev.clientY-r.top)/r.height-.5;
  if(Math.abs(u)<.2&&Math.abs(v)<.2)return"center";
  return Math.abs(v)>=Math.abs(u)?(v<0?"top":"bottom"):(u<0?"left":"right");
}
// 入れ替え：札を引きずって、別の札の上で離すと入れ替わる（手札とストックの間も）。空いたマスの上で離すとそこへ移る。指一本でできる
// 引きずってくっつける（KJ-017）：相手の札の、落とすと字になる面（青く光る）で離すとくっつく。光っていない所で離したら入れ替え・移す
function attachDrag(b,id){
  b.dataset.id=id;
  b.addEventListener("pointerdown",e=>{
    if(!G||G.over||(e.pointerType==="mouse"&&e.button!==0))return;
    const sx=e.clientX,sy=e.clientY;let moved=false,over=null,jt=null;
    const rows=[$("meHand"),$("meTray")];
    const under=(ev)=>{const t=document.elementFromPoint(ev.clientX,ev.clientY);const el=t&&t.closest("[data-id],.slot.free");return el&&el!==b&&+el.dataset.id!==id&&rows.includes(el.parentNode)&&(el.dataset.id||el.parentNode!==b.parentNode)?el:null};
    const myChar=()=>{const x=G.byId(G.me,id);return x?x.c:null};
    const facesOf=(el)=>{const x=el&&el.dataset.id&&G.byId(G.me,+el.dataset.id),c=myChar();return x&&c?K.faceJoins(T,c,x.c):{}};
    // いま離したら、どの面でくっつくか（字にならない面・札でない所は null）
    const target=(ev,t)=>{if(!t||!t.dataset.id)return null;const fs=facesOf(t),f=faceAt(t,ev);return fs[f]?{face:f,chars:fs[f]}:null};
    const clearJt=()=>{if(jt){jt.classList.remove("jt");jt.querySelectorAll(".fz").forEach(z=>z.remove());jt=null}};
    const showJt=(t,face)=>{
      if(jt!==t){clearJt();jt=t;t.classList.add("jt");for(const f of Object.keys(facesOf(t))){const z=document.createElement("span");z.className="fz "+f;z.dataset.face=f;t.appendChild(z)}}
      jt.querySelectorAll(".fz").forEach(z=>z.classList.toggle("on",z.dataset.face===face));
    };
    // くっつけられる相手の枠を青に。引きずっている途中で画面が描き直されても（CPU の手など）、動かすたびに付け直す
    const markJoinable=()=>{for(const el of document.querySelectorAll("#meHand [data-id],#meTray [data-id]"))if(+el.dataset.id!==id&&!el.classList.contains("joinable")&&Object.keys(facesOf(el)).length)el.classList.add("joinable")};
    const move=ev=>{
      if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>10){moved=true;b.classList.add("drag");document.body.classList.add("dragging")}
      if(!moved)return;
      markJoinable();
      if(jt&&!jt.isConnected)jt=null;
      const t=under(ev),can=t&&Object.keys(facesOf(t)).length;
      if(can)showJt(t,null);else clearJt(); // 先に大きくしてから、大きくなった札で面を決める（離したときと同じ大きさで決める）
      const hit=target(ev,t);
      if(can)showJt(t,hit?hit.face:null);
      const sw=hit?null:t; // 光る面の上では入れ替えの印を出さない
      if(over&&over!==sw)over.classList.remove("over");over=sw;if(sw)sw.classList.add("over");
    };
    const up=ev=>{
      document.removeEventListener("pointermove",move);document.removeEventListener("pointerup",up);document.removeEventListener("pointercancel",up);
      if(!moved){document.body.classList.remove("dragging");return}
      dragEnded=true;setTimeout(()=>{dragEnded=false},0);
      const t=under(ev),hit=target(ev,t); // 落とす先は、空のストックが広いまま（引きずり中の形）で決めてから、元へ戻す
      document.body.classList.remove("dragging");
      clearJt();document.querySelectorAll(".tile.joinable").forEach(el=>el.classList.remove("joinable"));
      b.classList.remove("drag");if(over)over.classList.remove("over");
      if(!t||ev.type!=="pointerup"||!G||G.over)return;
      if(hit){
        const tid=+t.dataset.id,done=(r)=>{hideChoices();if(r&&r.ok)lastTried="";afterChange()};
        if(hit.chars.length>1){showChoices([{label:"できる字",chars:hit.chars,pick:x=>done(G.joinFace(G.me,id,tid,hit.face,x))}]);return}
        done(G.joinFace(G.me,id,tid,hit.face));return;
      }
      if(t.dataset.id)G.swap(G.me,id,+t.dataset.id);else G.move(G.me,id,t.parentNode===$("meTray"));afterChange();
    };
    document.addEventListener("pointermove",move);document.addEventListener("pointerup",up);document.addEventListener("pointercancel",up);
  });
}
function tapRow(id){if(G.over)return;noteTried();row=row.filter(x=>x!==id);hideChoices();afterChange()}
function tapField(id){
  if(!G||G.over)return;
  if(MC){const mc=MC;mc.take(id).then(r=>{if(stale(mc))return;if(!r.ok)showWhy(r.why);afterChange()});afterChange();return} // 合言葉の部屋：先に入れた方だけ取れる
  const r=G.take(G.me,id);if(!r.ok)showWhy(r.why);afterChange()
}
// 返事待ちのあいだに試合が終わった・捨てた・別の試合になったときの返事は、画面に反映しない（勝ち負けの表示を上書きしない）
function stale(mc){if(MC===mc&&G&&!G.over)return false;if(G)afterChange();return true}
function showWhy(why){const m=$("msg");m.textContent=why||"";m.className="msg"}
function afterOp(res){if(res&&res.ok){row=res.cards?res.cards.map(x=>x.id):[];lastTried=""}hideChoices();afterChange()}
const isSingleTry=s=>s.rc.length===1&&!s.rl.ok&&[...s.text].length===1; // 1字は押せるが、はじかれる（KJ-008）
$("bRelease").onclick=()=>{
  const s=rowState();
  // 1字は放てない（KJ-008）：はじいて理由を出し、ログに「ためした」で残す。札は台（選び）に残る
  if(isSingleTry(s)){
    const why=s.rl.why;G.tried(G.me,[s.text],why);
    const m=$("msg");m.textContent=why;m.className="msg";hideChoices();afterChange();return;
  }
  if(MC){const mc=MC;mc.release([...row]).then(r=>{if(stale(mc))return;if(!r.ok&&r.why&&(r.lost||r.why==="つながらない"||r.why==="通信中"))showWhy(r.why);afterOp(r)});afterChange();return} // 合言葉の部屋：言葉は先に放った方だけ
  afterOp(G.release(G.me,[...row]));
};
$("bSplit").onclick=()=>afterOp(G.split(G.me,row));
$("bJoin").onclick=()=>{
  const s=rowState();
  if(s.joins.length>1){showChoices([{label:"できる字",chars:s.joins,pick:x=>afterOp(G.join(G.me,row,x))}]);return}
  afterOp(G.join(G.me,row));
};
$("bInvert").onclick=()=>afterOp(G.invert(G.me,row));
$("bCycle").onclick=()=>afterOp(G.cycle(G.me,row));
$("bBack").onclick=()=>{noteTried();row=[];hideChoices();afterChange()};
$("bRedraw").onclick=()=>{row=[];hideChoices();if(MC){const mc=MC;mc.redraw().then(()=>{if(!stale(mc))afterChange()});afterChange();return}G.redraw(G.me);afterChange()}; // 部屋：手札はすぐ入れ替わる。点の送りの返事は待たずに描く
$("bHomo").onclick=()=>{
  const c=rowText();
  showChoices((T.HOMO.get(c)||[]).map(g=>({label:`${g.type==="on"?"音":"訓"}：${g.reading}`,chars:g.chars.filter(x=>x!==c),
    pick:x=>{if(G.ready(G.me,"homophone")&&rowText()===c)afterOp(G.homophone(G.me,row,x))}})));
};
function showChoices(groups){
  const box=$("choices");box.innerHTML="";
  for(const g of groups){
    const d=document.createElement("div");d.className="g";
    d.innerHTML=`<span>${g.label}</span>`;
    for(const x of g.chars){const b=document.createElement("button");b.textContent=x;b.onclick=()=>g.pick(x);d.appendChild(b)}
    box.appendChild(d);
  }
  box.classList.add("on");
}
function hideChoices(){$("choices").classList.remove("on")}

// ---------- 描画 ----------
function tileEl(x,{onClick,shown,ord}={}){
  const b=document.createElement(onClick?"button":"div");
  b.className="tile"+(K.isChar(T,x.c)?"":" part")+(x.fresh&&clock()-x.t<1.5?" new":"");
  b.textContent=shown||x.c;
  const m=K.marks(T,x.c,STR.ICONS);
  if(m){const s=document.createElement("span");s.className="mk";s.textContent=m;b.appendChild(s);b.classList.add("hasmk")}
  // 割れる札の点線（KJ-014）。左右に割れる字は縦、上下は横、1本で表せない字は角に「割」
  const cut=K.cutSpec(T,x.c);
  if(cut){
    const s=document.createElement("span");
    if(cut.kind==="x"){s.className="cut cutx";s.textContent="割"}
    else{
      s.className="cut cut"+cut.kind;s.style.setProperty("--at",cut.at);
      if(cut.kind==="v"){if(cut.at>0.55)s.classList.add("r");if(cut.at<0.35)s.classList.add("l")}else if(cut.at<0.32)s.classList.add("t");
    }
    s.dataset.cut=cut.kind;b.appendChild(s);
  }
  if(shown&&shown!==x.c){const s=document.createElement("span");s.className="orig";s.textContent=x.c;b.appendChild(s)}
  if(ord){b.classList.add("sel");const s=document.createElement("span");s.className="ord";s.textContent=ord;b.appendChild(s)}
  if(onClick)b.onclick=onClick;
  b.title=x.c;
  return b;
}
// 手札は上限の数だけマスを置く。選んだ札はそのマスに残り、色が変わって選んだ順の数字が付く（KJ-030。台には写しを並べる）。
// ストック（字も部品も置ける。手札が埋まっていると、割る・くっつけるでできた札が入る）は手札の下に別に見せる
function renderHand(el,p,interactive,tray){
  el.innerHTML="";
  const inRow=interactive?new Set(row):new Set();
  const cards=p.cards.filter(x=>!!x.tray===!!tray);
  for(const x of cards){
    const t=tileEl(x,interactive?{onClick:()=>tapHand(x.id),ord:inRow.has(x.id)?row.indexOf(x.id)+1:0}:{});
    if(interactive)attachDrag(t,x.id);
    el.appendChild(t);
  }
  if(tray)el.classList.toggle("empty",!cards.length);
  const max=tray?D.rules.split_extra:D.rules.hand_max;
  for(let i=cards.length;i<max;i++){const s=document.createElement("div");s.className="slot"+(interactive?" free":"");el.appendChild(s)}
}
function renderField(){
  const el=$("field"),can=!G.over&&G.me.takes>0&&G.handCount(G.me)<D.rules.hand_max;
  el.className="field"+(can?" can":"");el.innerHTML="";
  el.style.gridTemplateColumns=`repeat(${D.rules.field_size},1fr)`;
  for(const x of G.field)el.appendChild(tileEl(x,{onClick:()=>tapField(x.id)}));
  $("takes").textContent=G.me.takes>0?(G.handCount(G.me)<D.rules.hand_max?`あなたは ${G.me.takes} 枚取れる（タップ）`:`${G.me.takes} 枚取れる（手札がいっぱい）`):"";
}
// ゲージ（KJ-034）：待っている間は class cd と --g（0〜1）。待ちが明けたら外して、小さく光らせる（full）
function gauge(b,waiting,f){
  const was=b.classList.contains("cd")&&b._game===G; // 前の試合から残った cd は、光らせずに外す
  b._game=G;
  b.classList.toggle("cd",waiting);
  if(waiting){b.style.setProperty("--g",f.toFixed(3));return}
  b.style.removeProperty("--g");
  if(was){b.classList.remove("full");void b.offsetWidth;b.classList.add("full");clearTimeout(b._fullT);b._fullT=setTimeout(()=>b.classList.remove("full"),700)}
}
function cdText(p,k){const t=G.cdLeft(p,k);return t>0?Math.ceil(t)+"s":""}
function render(){
  if(!G)return;
  row=row.filter(id=>G.byId(G.me,id));
  $("cpuSide").hidden=G.solo;
  $("cpuName").textContent=G.cpu.name;
  renderHand($("cpuHand"),G.cpu,false,false);
  renderHand($("meHand"),G.me,true,false);
  renderHand($("meTray"),G.me,true,true);
  renderField();
  for(const [sc,ct,p] of [[$("meScore"),$("meCount"),G.me],[$("cpuScore"),$("cpuCount"),G.cpu]]){
    sc.textContent=`${p.score} 点`;
    ct.textContent=`手札 ${p.remote?(typeof p.hand==="number"?p.hand:p.count):G.handCount(p)} / ${D.rules.hand_max}`;
  }
  $("trayHead").textContent=`ストック（字も部品も置ける。${G.trayCount(G.me)} / ${D.rules.split_extra}）`;
  // 台：選んだ札の写しを、選んだ順に左から並べる（札そのものは手札・ストックのマスに残っている。KJ-030）
  const rowEl=$("row");rowEl.innerHTML="";
  const s=rowState();
  if(!s.rc.length)rowEl.innerHTML='<span class="empty">手札をタップして選ぶ（選んだ順に台に並ぶ）</span>';
  s.rc.forEach((x,i)=>{
    const shown=(i===0&&s.joins.length&&D.radical_forms.left[x.c])||null;
    const t=tileEl({...x,fresh:false},{onClick:()=>tapRow(x.id),shown});
    rowEl.appendChild(t);
  });
  const w=T.WORDS.get(s.text),info=$("info");
  const rev=s.reversed?' <span class="rev">並べる順が逆</span>':"";
  const pts=s.rl.ok?` <span class="pts">${K.scoreOf(D,T,s.text).pts}点</span>`:"";
  if(!s.text)info.innerHTML="";
  else if(w)info.innerHTML=`<span class="w">${s.text}</span>${pts} ${w.kana}${w.yoji?"（四字熟語）":""} — ${w.en.join(" / ")}${s.rl.ok?"":` <span class="no">（${s.rl.why}）</span>`}${rev}`;
  else if(s.reversed)info.innerHTML=rev.trim();
  else if(s.rl.ok&&D.readings.readings[s.text]){const r=D.readings.readings[s.text];info.innerHTML=`<span class="w">${s.text}</span>${pts} ${[...r.on,...r.kun].slice(0,6).join("・")}`}
  else if(s.joins.length)info.innerHTML=`くっつけると ${s.joins.join(" か ")}`;
  else info.innerHTML=s.rl.ok?`<span class="w">${s.text}</span>${pts}`:`<span class="no">${s.rl.why}</span>`;
  renderReleased();
  renderOps();
}
function renderOps(){
  const s=rowState(),one=s.rc.length===1?s.rc[0].c:null,me=G.me,live=!G.over;
  const fit1=G.fits(me,row,1);
  const cds=[["反転","invert"],["巡り","cycle"],["同音","homophone"]].map(([n,k])=>cdText(G.cpu,k)&&`${n} ${cdText(G.cpu,k)}`).filter(Boolean);
  if(G.cpu.redrawAt!==null)cds.push(`引き直し ${Math.ceil(G.redrawLeft(G.cpu))}s`);
  const gone=!!(MC&&MC.oppGone()&&!G.over);
  $("cpuCds").textContent=gone?"相手の通信が切れた":cds.length?"待ち："+cds.join("・"):"";
  $("cpuCds").classList.toggle("gone",gone);
  $("bRelease").disabled=!(live&&(s.rl.ok||isSingleTry(s)));
  $("bSplit").disabled=!(live&&one&&K.canSplit(T,one)&&G.fits(me,row,2));
  $("bJoin").disabled=!(live&&s.joins.length&&fit1);
  $("bInvert").disabled=!(live&&one&&T.INV.has(one)&&G.ready(me,"invert")&&fit1);
  $("bCycle").disabled=!(live&&one&&T.NEXT.has(one)&&G.ready(me,"cycle")&&fit1);
  $("bHomo").disabled=!(live&&one&&T.HOMO.has(one)&&G.ready(me,"homophone")&&fit1);
  $("bBack").disabled=!s.rc.length;
  $("bRedraw").disabled=!(live&&me.redrawAt===null);
  // 待ち時間はボタンの地のゲージで見せる（KJ-034。秒数の文字は出さない）
  gauge($("bInvert"),G.cdLeft(me,"invert")>0,G.cdFrac(me,"invert"));
  gauge($("bCycle"),G.cdLeft(me,"cycle")>0,G.cdFrac(me,"cycle"));
  gauge($("bHomo"),G.cdLeft(me,"homophone")>0,G.cdFrac(me,"homophone"));
  gauge($("bRedraw"),me.redrawAt!==null,G.redrawFrac(me));
  const rc=D.rules.redraw;
  $("cdRedraw").textContent=me.redrawAt!==null||me.score<rc.cost?STR.redrawNote.free(rc.free_wait_sec):STR.redrawNote.cost(rc.cost);
  const left=Math.ceil(G.timeLeft());
  $("clock").textContent=`残り ${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;
}
function renderReleased(){
  const ul=$("released"),items=G.log.filter(e=>e.op==="放つ");
  if(ul.childElementCount===items.length)return;
  ul.innerHTML="";
  for(const e of items.slice().reverse()){
    const text=e.from.join(""),w=T.WORDS.get(text);
    const li=document.createElement("li");li.className=e.who===G.me.name?"me":"";
    li.innerHTML=`<span class="who">${e.who}</span>：<span class="w">${text}</span> ${w?w.kana:""} +${e.pts}点`;
    ul.appendChild(li);
  }
}
function showFx(who,text){
  const fx=$("fx"),box=$("fxChars");box.innerHTML="";$("fxWho").textContent=who;
  fx.classList.add("on");
  [...text].forEach((c,i)=>{const s=document.createElement("div");s.className="c";s.textContent=c;box.appendChild(s);
    setTimeout(()=>s.classList.add("in"),180+i*380)});
  clearTimeout(showFx.t);showFx.t=setTimeout(()=>fx.classList.remove("on"),400+text.length*380+900);
}
function buildHowto(){
  const R=D.rules,S=R.score,TL=(G&&G.timeLimit)||timeLimit; // 合言葉の部屋の入った側は、作った人の時間
  $("lead").textContent=`手札を組み替えて言葉を作り、放つと点が入る。放った字数だけ場から字を取れる。先に ${R.win.score} 点か、${(TL||R.win.time_limit_sec)/60} 分で点の多い方が勝ち。`;
  $("howto").innerHTML=[
    `<b>選ぶ</b>：手札・ストックの札をタップすると、札はそのマスに残ったまま色が変わって選ばれ、角に選んだ順の数字（1・2・3…）が出る。台には、選んだ札の写しが選んだ順に左から並ぶ。もう一度タップ（手札の札でも、台の写しでも）で外れる。ボタンは選んだ札に、選んだ順で働く。`,
    `<b>入れ替え・移す</b>：札を指で引きずって、別の札の上で離すと位置が入れ替わる（手札とストックの間でもよい）。空いたマスの上で離すと、そこへ移る。`,
    `<b>放つ</b>：台の札が辞書の語（2〜4字）なら放てる。<b>1字では放てない</b>（くっつけて作った字でも同じ）。一度放った言葉は二人とも二度と使えない。放った札は消える（相手には届かない）。`,
    `<b>点数</b>：${Object.entries(S.by_length).map(([n,p])=>`${n}字 ${p}点`).join("・")}。四字熟語は ${S.yoji_mult} 倍、特別な語（天上天下）はさらに ${S.special_mult} 倍。`,
    `<b>取る</b>：放ったら、放った字数と同じ枚数を<b>場</b>から選んで取れる（手札は ${R.hand_max} 枚まで）。取ったところには山から次の字が出る。相手も同じ場から取るので早い者勝ち（ひとりでは取り合いなし）。`,
    `<b>ストック</b>：手札（${R.hand_max} マス）の下の ${R.split_extra} マス。字も部品も置ける。割る・くっつけるでできた札は、手札に空きがなければストックに入る（全部で ${R.hand_max+R.split_extra} 枚まで）。場から取るのは手札の ${R.hand_max} マスまで。ストックの札も選んで使える。`,
    `<b>はじまり</b>：はじめの手札は ${R.start_hand} 枚。はじめたらすぐ時間が動く。ストックには、使いやすい部品が ${R.start_stock_parts} 枚、最初から入っている。`,
    `<b>台</b>は並べて見る場所：選んだ札は手札・ストックのマスにいるまま、台にはその写しが出る（枚数は変わらない）。`,
    `<b>レベル</b>：はじめる前に選ぶ（N5／N4。N4 は N5＋N4 の字）。山に入る字・語・割り方・対義・巡り・同音がレベルで変わる。いまは ${K.levelLabel(T.level)}（字 ${T.CHARS.size}・語 ${T.WORDS.size}）。`,
    `<b>相手</b>：はじめる前に選ぶ。ひとりで（CPU なし。50 点では終わらず、${(TL||R.win.time_limit_sec)/60} 分たったら点を出す。この端末の自己ベストを覚える）／とても弱い（CPU は ${R.cpu.weak_interval_sec[0]}〜${R.cpu.weak_interval_sec[1]} 秒に1回）／ふつう（${R.cpu.fair_interval_sec[0]}〜${R.cpu.fair_interval_sec[1]} 秒に1回）／いまの強さ（${R.cpu.interval_sec[0]}〜${R.cpu.interval_sec[1]} 秒に1回）。`,
    `<b>割る</b>：台の1枚を部品表で一段だけ割る。<b>くっつける</b>：台の2枚を、左→右の順でくっつける。逆に並べたときは「並べる順が逆」と出る。十・口 のように2通りの字になるときは選ぶ。`,
    `<b>反転</b>（印：${STR.ICONS.invert}）対義の字に。${R.cooldown_sec.invert} 秒待ち。<b>巡り</b>（印：${STR.ICONS.cycle}）${T.CYCLES.map(c=>c.name).join("・")}を1つ先へ。${R.cooldown_sec.cycle} 秒待ち。<b>同音</b>（印：${STR.ICONS.homophone}）同じ読みの字から選ぶ。${R.cooldown_sec.homophone} 秒待ち。待ち時間は操作ごとで、二人は別々。`,
    `<b>引き直し</b>：${R.redraw.cost} 点払って手札を全部入れ替える（${R.start_hand} 枚）。${R.redraw.cost} 点ないときは ${R.redraw.free_wait_sec} 秒待てば 0 点で入れ替わる（待つあいだも動ける）。`,
    `<b>勝ち</b>：先に ${R.win.score} 点。または ${(TL||R.win.time_limit_sec)/60} 分たって点の多い方。CPU の速さは相手の選び方で変わる。`,
    `${Object.keys(D.radical_forms.left).join("・")} を左に置いてくっつけられるときは、${Object.values(D.radical_forms.left).join("・")} の形で見せる（札はもとの字のまま）。色の薄い札は部品（字ではない）。`,
    `<b>ログ</b>：一手ごとの記録。上の「ログ」で見てコピーできる。終わったら「ログをコピー」が出る。`,
  ].map(x=>`<li>${x}</li>`).join("");
}
let roomBusy=false;
function pump(){
  if(!G||G.over)return;
  if(MC){ // 合言葉の部屋：時間切れ・点の送り・まだいる（ping）は MC.tick
    if(roomBusy)return;roomBusy=true;const mc=MC;
    mc.tick().then(ch=>{roomBusy=false;if(MC!==mc)return;if(ch)afterChange();else renderOps()},()=>{roomBusy=false});
    return;
  }
  if(G.tick())afterChange();else renderOps();
}
setInterval(pump,250);
// 画面が裏に回ると時計の処理が止まる。戻ったらすぐ時間切れを確かめる（制限時間をすぎていれば、その時刻で終わる）。CPU は新しく数え直す（KJ-036）
document.addEventListener("visibilitychange",()=>{
  if(document.hidden||!G||G.over)return;
  pump();
  if(!G.over&&!G.solo&&!G.match){clearTimeout(cpuTimer);scheduleCpu()} // 人と対戦は CPU を出さない
});

window.__KJ={get game(){return G},get row(){return row},get tables(){return T},get mc(){return MC},get room(){return ROOM},data:D,render}; // ブラウザのテスト用

Promise.all(K.FILES.map(f=>fetch(`data/${f}.json`).then(r=>r.json()).then(j=>D[f]=j)))
  .then(()=>{loadSettings();T=tablesFor(level);buildPickers();buildHowto();showCounts();roomUi()})
  .catch(e=>{$("setupInfo").textContent="データを読めませんでした（file:// では開けません。Pages かローカルのサーバーで開いてください）"});
